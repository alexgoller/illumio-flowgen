# Classic web / app / db application with clients and infra services.
name = "three-tier"

[rate]
flows_per_sec = 50
shape = "sine"
period_secs = 600
amplitude = 0.4

# Labels for `flowgen ips --format workloader`
# app/env/loc for the whole 10.1.0.0/16 estate; narrower groups below add role and hostname
[[host]]
nets = ["10.1.0.0/16"]
labels = { app = "portal", env = "prod", loc = "dc1" }

[[host]]
nets = ["192.168.10.0/27"]
labels = { app = "portal", env = "prod", loc = "office", role = "client" }
hostname_prefix = "client"

# DNS/NTP servers (app overridden by the more specific net)
[[host]]
nets = ["10.1.0.10/31"]
labels = { role = "dns", app = "infra" }
hostname_prefix = "dns"

[[host]]
nets = ["10.1.1.8/29"]
labels = { role = "web" }
hostname_prefix = "web"

[[host]]
nets = ["10.1.2.8/29"]
labels = { role = "app" }
hostname_prefix = "app"

[[host]]
nets = ["10.1.3.8/30"]
labels = { role = "db" }
hostname_prefix = "db"

[[rule]]
name = "clients-to-web"
src = ["192.168.10.0/27"]
dst = ["10.1.1.8/29"]
proto = "tcp"
dst_ports = [80, 443]
weight = 6

[[rule]]
name = "web-to-app"
src = ["10.1.1.8/29"]
dst = ["10.1.2.8/29"]
proto = "tcp"
dst_ports = [8080]
weight = 4

[[rule]]
name = "app-to-db"
src = ["10.1.2.8/29"]
dst = ["10.1.3.8/30"]
proto = "tcp"
dst_ports = [5432, 3306]
weight = 3

[[rule]]
name = "dns"
src = ["10.1.1.8/29", "10.1.2.8/29", "10.1.3.8/30"]
dst = ["10.1.0.10/31"]
proto = "udp"
dst_ports = [53]
weight = 2

[[rule]]
name = "ntp"
src = ["10.1.1.8/29", "10.1.2.8/29", "10.1.3.8/30"]
dst = ["10.1.0.10/31"]
proto = "udp"
dst_ports = [123]
weight = 1
