# Several application subnets with a mix of common datacenter services.
name = "datacenter"

[rate]
flows_per_sec = 100
shape = "constant"

# Labels for `flowgen ips --format workloader`
[[host]]
nets = ["10.10.0.0/16"]
labels = { app = "erp", env = "prod", loc = "dc1" }

[[host]]
nets = ["10.10.1.0/28"]
labels = { role = "web" }
hostname_prefix = "web"

[[host]]
nets = ["10.10.2.0/28"]
labels = { role = "app" }
hostname_prefix = "app"

[[host]]
nets = ["10.10.3.0/28"]
labels = { role = "db" }
hostname_prefix = "db"

# shared services: kafka, ldap, admin ssh
[[host]]
nets = ["10.10.4.0/28"]
labels = { role = "svc", app = "infra" }
hostname_prefix = "svc"

[[rule]]
name = "web-to-app"
src = ["10.10.1.0/28"]
dst = ["10.10.2.0/28"]
proto = "tcp"
dst_ports = [443, 8443]
weight = 5

[[rule]]
name = "app-to-mssql"
src = ["10.10.2.0/28"]
dst = ["10.10.3.0/28"]
proto = "tcp"
dst_ports = [1433]
weight = 3

[[rule]]
name = "app-to-kafka"
src = ["10.10.2.0/28"]
dst = ["10.10.4.0/28"]
proto = "tcp"
dst_ports = [9092]
weight = 3

[[rule]]
name = "ldap"
src = ["10.10.1.0/28", "10.10.2.0/28", "10.10.3.0/28"]
dst = ["10.10.4.0/28"]
proto = "tcp"
dst_ports = [389, 636]
weight = 2

[[rule]]
name = "smb"
src = ["10.10.2.0/28"]
dst = ["10.10.3.0/28"]
proto = "tcp"
dst_ports = [445]
weight = 1

[[rule]]
name = "admin-ssh"
src = ["10.10.4.0/28"]
dst = ["10.10.1.0/28", "10.10.2.0/28", "10.10.3.0/28"]
proto = "tcp"
dst_ports = [22]
weight = 1

[[rule]]
name = "web-http"
src = ["10.10.1.0/28"]
dst = ["10.10.2.0/28"]
proto = "tcp"
dst_ports = [80]
weight = 1
