# flowgen scenario example. Run with:
#   flowgen run -c scenario.toml
# Some settings can be overridden on the command line: --collector, --protocol, --rate, --seed.
#
# PCE visibility: Flowlink flows only show up if at least one IP of each flow
# belongs to a managed or unmanaged workload. List every IP this file can emit with:
#   flowgen ips -c scenario.toml

# Optional: fixed seed for reproducible traffic.
# seed = 42

# How often plain (non-TTY) stats lines are printed.
stats_interval_secs = 10

[target]
# Flowlink listener. Port optional: defaults to 2055 (v5/v9) or 4739 (ipfix).
collector = "10.0.0.5:4739"
protocol = "ipfix"            # v5 | v9 | ipfix
observation_domain = 1        # v9 source id / IPFIX observation domain
template_refresh_secs = 30    # v9/IPFIX template resend interval
max_datagram = 1400           # bytes per UDP payload (256..65000); above 1472 datagrams IP-fragment, macOS caps UDP at 9216

[rate]
flows_per_sec = 200
shape = "sine"                # constant | sine | burst
period_secs = 300             # sine: length of one wave
amplitude = 0.5               # sine: +/- fraction of flows_per_sec
# burst_chance = 0.05         # burst: chance per second to start a burst
# burst_multiplier = 5        # burst: rate multiplier during a burst
# burst_secs = 10             # burst: burst length

# Labels for `flowgen ips --format workloader`
# Optional [[host]] tables give the generated IPs Illumio labels and hostnames. Fields:
#   nets            required, non-empty: CIDRs or bare IPs this group covers
#   labels          optional: Illumio labels (role, app, env, loc); keys and values non-empty
#   hostname_prefix optional: hostname is "<prefix>-<a>-<b>-<c>-<d>" (letters, digits, inner '-'; default "fg")
# Merge rules: every group whose net contains an IP applies, ordered by the most specific
# matching prefix length (file order breaks ties); later/more specific groups overwrite
# earlier ones per label key and for hostname_prefix. So put app/env/loc on a broad net
# and role + hostname_prefix on narrow nets. Scan src IPs need labels too.
[[host]]
nets = ["10.1.0.0/16"]
labels = { app = "shop", env = "prod", loc = "dc1" }

[[host]]
nets = ["10.1.1.0/28"]
labels = { role = "web" }
hostname_prefix = "web"

[[host]]
nets = ["10.1.2.0/28"]
labels = { role = "app" }
hostname_prefix = "app"

[[host]]
nets = ["10.1.3.10"]
labels = { role = "db" }
hostname_prefix = "db"

[[host]]
nets = ["10.1.0.53"]
labels = { role = "dns", app = "infra" }   # app overrides the broad group above
hostname_prefix = "dns"

[[host]]
nets = ["10.9.9.9"]                  # the port scanner
labels = { role = "attacker", app = "external", env = "prod" }
hostname_prefix = "scanner"

# Weighted traffic rules: each flow picks a rule by weight, then random
# src/dst hosts from the CIDR lists (bare IPs are /32).
[[rule]]
name = "web-to-app"
src = ["10.1.1.0/28"]
dst = ["10.1.2.0/28"]
proto = "tcp"                 # tcp | udp | icmp
dst_ports = [8080, 8443]
weight = 5
# packets = [5, 200]          # per-flow packet count range
# bytes_per_packet = [60, 1400]

[[rule]]
name = "app-to-db"
src = ["10.1.2.0/28"]
dst = ["10.1.3.10"]
proto = "tcp"
dst_ports = [5432]
weight = 3

[[rule]]
name = "dns"
src = ["10.1.1.0/28", "10.1.2.0/28"]
dst = ["10.1.0.53"]
proto = "udp"
dst_ports = [53]
weight = 1

# Port scan bursts (on top of the regular rate). First burst after every_secs.
[[scan]]
src = "10.9.9.9"
dst = ["10.1.2.0/28"]
ports = "1-1024"              # or a list: [22, 3389]
every_secs = 120
flows_per_burst = 200
