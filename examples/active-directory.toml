# Sample: Windows estate. Workstations and member servers talk to domain controllers (Kerberos, LDAP, RPC, SMB, DNS),
# workstations use file servers, and one admin jump host reaches servers over RDP/WinRM.
# In Illumination look for the domain controllers as the hub and the jump host as the only admin-protocol source.
# Run: flowgen run -c /usr/share/doc/flowgen/examples/active-directory.toml --collector <flowlink-host>
# Create matching unmanaged workloads with: flowgen ips -c /usr/share/doc/flowgen/examples/active-directory.toml
name = "active-directory"

[rate]
flows_per_sec = 60
shape = "constant"

[[rule]]
name = "kerberos-tcp"
src = ["192.168.30.0/27", "10.30.2.0/28"]   # workstations, member servers
dst = ["10.30.1.10", "10.30.1.11", "10.30.1.12"]   # domain controllers
proto = "tcp"
dst_ports = [88]                   # kerberos
weight = 6

[[rule]]
name = "kerberos-udp"
src = ["192.168.30.0/27", "10.30.2.0/28"]
dst = ["10.30.1.10", "10.30.1.11", "10.30.1.12"]
proto = "udp"
dst_ports = [88]                   # kerberos
weight = 4
packets = [1, 4]
bytes_per_packet = [100, 1200]

[[rule]]
name = "ldap-ldaps-gc"
src = ["192.168.30.0/27", "10.30.2.0/28"]
dst = ["10.30.1.10", "10.30.1.11", "10.30.1.12"]
proto = "tcp"
dst_ports = [389, 636, 3268]       # ldap, ldaps, global catalog
weight = 6

[[rule]]
name = "rpc-smb-to-dc"
src = ["192.168.30.0/27", "10.30.2.0/28"]
dst = ["10.30.1.10", "10.30.1.11", "10.30.1.12"]
proto = "tcp"
dst_ports = [135, 445]             # rpc endpoint mapper, smb (sysvol/netlogon)
weight = 4

[[rule]]
name = "dns"
src = ["192.168.30.0/27", "10.30.2.0/28"]
dst = ["10.30.1.10", "10.30.1.11", "10.30.1.12"]
proto = "udp"
dst_ports = [53]                   # dns
weight = 8
packets = [1, 2]
bytes_per_packet = [60, 300]

[[rule]]
name = "workstations-to-file-servers"
src = ["192.168.30.0/27"]
dst = ["10.30.3.10/31"]            # 2 file servers
proto = "tcp"
dst_ports = [445]                  # smb
weight = 6

[[rule]]
name = "jump-host-rdp-winrm"
src = ["10.30.4.5"]                # admin jump host
dst = ["10.30.2.0/28", "10.30.3.10/31"]
proto = "tcp"
dst_ports = [3389, 5985]           # rdp, winrm (http)
weight = 1
