[package]
name = "flowgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "NetFlow v5/v9 and IPFIX traffic generator for testing Illumio Flowlink"
authors = ["Alex Goller"]
license = "Proprietary"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
humantime = "2.4"
indicatif = "0.18"
ipnet = { version = "2.12", features = ["serde"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
netflow_parser = { version = "1.0.6", features = ["netflow_common"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
