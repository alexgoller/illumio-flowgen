[package]
name = "flowgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "NetFlow v5/v9 and IPFIX traffic generator for testing Illumio Flowlink"
authors = ["Alex Goller"]
license = "Proprietary"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
humantime = "2.4"
indicatif = "0.18"
ipnet = { version = "2.12", features = ["serde"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
netflow_parser = { version = "1.0.6", features = ["netflow_common"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[package.metadata.deb]
maintainer = "Alex Goller"
section = "net"
priority = "optional"
extended-description = "Generates NetFlow v5/v9 and IPFIX traffic for testing and demoing Illumio Flowlink."
assets = [
  ["target/release/flowgen", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/flowgen/README.md", "644"],
  ["examples/*.toml", "usr/share/doc/flowgen/examples/", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/flowgen", dest = "/usr/bin/flowgen", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/flowgen/README.md", mode = "644", doc = true },
  { source = "examples/*.toml", dest = "/usr/share/doc/flowgen/examples/", mode = "644", doc = true },
]
